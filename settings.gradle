rootProject.name = 'metadata-microservice'

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven {
            url = uri('https://maven.pkg.github.com/Phortran/spring-boot-ms-version-catalog')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ? System.getenv('GITHUB_ACTOR') : "$gpr_user"
                password = System.getenv('GITHUB_TOKEN') ? System.getenv('GITHUB_TOKEN') : "$gpr_key"
            }
        }
    }

    versionCatalogs {
        libs {
            from('com.panopticode:spring-boot-ms-version-catalog:1.1.1')
        }
        testLibs {
            from('com.panopticode:ms-test-version-catalog:1.0.5')
        }
    }
}

include 'custom-checks'
include 'test-common'
