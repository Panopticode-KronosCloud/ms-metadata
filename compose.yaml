services:
  webapp:
    image: 'java-spring-boot-ms-template-webapp:rc1'
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 'java-spring-boot-ms-template-webapp'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8081:8080'
    expose:
      - '8000'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/java-spring-boot-ms-template-db
      - SPRING_DATASOURCE_USERNAME=local-dev-only
      - SPRING_DATASOURCE_PASSWORD=local-dev-only
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    healthcheck:
      # "curl --fail --silent localhost:8081/status | grep OK || exit 1"
      # TODO replace this silly thing with a command similar to the above, with wget
      test: "echo OK"
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: 'postgres:17.4-alpine3.21'
    container_name: 'java-spring-boot-ms-template-db'
    environment:
      - 'POSTGRES_DB=java-spring-boot-ms-template-db'
      - 'POSTGRES_PASSWORD=local-dev-only'
      - 'POSTGRES_USER=local-dev-only'
    ports:
      - '5432:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready --username=local-dev-only --dbname=java-spring-boot-ms-template-db' ]
      interval: 5s
      timeout: 5s
      retries: 5
