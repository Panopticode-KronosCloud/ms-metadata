get:
  description: Returns all ingredients related to a recipe
  summary: Get all ingredients
  tags:
    - cookbook
  operationId: getAllRecipeIngredients
  parameters:
    - name: recipeId
      in: path
      description: Recipe id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: List of ingredients
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/responses/Ingredient.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
post:
  description: Add a new ingredient to a recipe
  summary: Add new ingredient
  tags:
    - cookbook
  operationId: addIngredient
  parameters:
    - name: recipeId
      in: path
      description: Recipe id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '201':
      description: successful operation
      content:
        application/json:
          schema:
            $ref: ../components/responses/Ingredient.yaml
    '405':
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
  requestBody:
    $ref: ../components/requestBodies/NewIngredientRequest.yaml
delete:
  description: Deletes all ingredients off a recipe
  summary: Deletes all ingredients
  tags:
    - cookbook
  operationId: deleteAllIngredients
  parameters:
    - name: recipeId
      in: path
      description: Recipe id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: Deletion completed successfully
    '404':
      description: Invalid recipe id
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
