get:
  description: Returns a recipe by ID
  summary: Get a recipe
  tags:
    - cookbook
  operationId: getRecipeById
  parameters:
    - name: recipeId
      in: path
      description: ID of the recipe to return
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Recipe
      content:
        application/json:
          schema:
            $ref: ../components/responses/Recipe.yaml
    '400':
      description: Invalid ID supplied
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
    '404':
      description: Recipe not found
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
put:
  description: Update an existing recipe
  summary: Update recipe
  tags:
    - cookbook
  operationId: updateRecipe
  parameters:
    - name: recipeId
      in: path
      description: Recipe id to update
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: successful operation
      content:
        application/json:
          schema:
            $ref: ../components/responses/RecipeRef.yaml
    '400':
      description: Invalid ID supplied
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
    '404':
      description: Recipe not found
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
    '405':
      description: Validation exception
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
  requestBody:
    $ref: ../components/requestBodies/UpdateRecipeRequest.yaml
delete:
  description: Deletes an existing recipe from the cookbook
  summary: Deletes a recipe
  tags:
    - cookbook
  operationId: deleteRecipe
  parameters:
    - name: recipeId
      in: path
      description: Recipe id to delete
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: Deletion completed successfully
    '404':
      description: Invalid recipe id
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
