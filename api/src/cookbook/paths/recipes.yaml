get:
  description: Returns all recipes in the cookbook
  summary: Get all recipes
  tags:
    - cookbook
  operationId: getAllRecipes
  responses:
    '200':
      description: List of recipes
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/responses/RecipeRef.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
post:
  description: Add a new recipe to the book
  summary: Add new recipe
  tags:
    - cookbook
  operationId: addRecipe
  responses:
    '201':
      description: successful operation
      content:
        application/json:
          schema:
            $ref: ../components/responses/Recipe.yaml
    '405':
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/responses/ErrorModel.yaml
  requestBody:
    $ref: ../components/requestBodies/NewRecipeRequest.yaml
