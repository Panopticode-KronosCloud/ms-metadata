description: Lighter recipe object, required fields
type: object
required:
  - name
  - servings
  - difficulty
  - prepTimeM
properties:
  name:
    type: string
  servings:
    type: integer
    format: int32
  textIntro:
    type: string
  picture:
    type: string
  thumbnail:
    type: string
  difficulty:
    $ref: ./Difficulty.yaml
  prepTimeM:
    type: integer
    format: int32
  cookTimeM:
    type: integer
    format: int32
  textOutro:
    type: string
