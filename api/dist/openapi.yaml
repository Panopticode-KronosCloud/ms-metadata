openapi: 3.0.3
info:
  title: metadata-microservice
  description: |-
    metadata-microservice
    This is the public API to interact with your webapp, based on the OpenAPI 3.0 specification.
  termsOfService: https://twitter.com/en/tos
  contact:
    name: API Support
    url: https://www.begambleaware.org/
    email: sink@etlgr.com
  license:
    name: GPL 3.0
    url: https://www.gnu.org/licenses/gpl-3.0.en.html
  version: 1.0.0
servers:
  - url: http://localhost:{port}/api/v1/metadata
    description: Local development container
    variables:
      port:
        enum:
          - '8080'
        default: '8080'
  - url: https://raspberrypi.tigon-court.ts.net/api/v1/metadata
    description: Production server
tags:
  - name: metadata
    description: Manage files and directories metadata
    externalDocs:
      description: Find out more
      url: https://en.wikipedia.org/wiki/Metadata
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
paths:
  /nodes:
    post:
      description: Create new metadata record
      summary: Create new metadata record
      tags:
        - metadata
      operationId: createMetadata
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata'
        '405':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      requestBody:
        $ref: '#/components/requestBodies/CreateMetadataRequest'
components:
  requestBodies:
    CreateMetadataRequest:
      description: Data object to save a new recipe
      required: true
      content:
        application/json:
          schema:
            description: Metadata record
            type: object
            required:
              - id
              - kind
              - name
              - created
              - last_modified
            properties:
              id:
                type: string
                format: uuid
              parent_id:
                type: string
                format: uuid
                nullable: true
              kind:
                type: string
                enum:
                  - file
                  - directory
              name:
                type: string
              created:
                type: string
                format: date-time
              last_modified:
                type: string
                format: date-time
              suggested_media_type:
                description: Suggested media type. Might be refined automatically.
                type: string
                nullable: true
              metadata:
                type: object
                additionalProperties: true
                nullable: true
              raw_access:
                type: boolean
                default: false
  schemas:
    ErrorModel:
      description: Generic error
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
    Metadata:
      description: Metadata record
      type: object
      required:
        - id
        - kind
        - name
        - created
        - last_modified
        - raw_access
        - status
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
            - file
            - directory
        blob_type:
          type: string
          nullable: true
        blob_ref:
          type: string
          nullable: true
        name:
          type: string
        created:
          type: string
          format: date-time
        last_modified:
          type: string
          format: date-time
        size_b:
          type: integer
          format: int64
          nullable: true
        media_type:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        hash_sha3_256:
          type: string
          nullable: true
        thumbnail:
          type: string
          nullable: true
        consolidate_v:
          type: string
          nullable: true
        raw_access:
          type: boolean
          default: false
        status:
          type: string
          enum:
            - unavailable
            - deleted
            - staged
            - ready
