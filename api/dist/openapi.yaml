openapi: 3.0.3
info:
  title: metadata-microservice
  description: |-
    metadata-microservice
    This is the public API to interact with your webapp, based on the OpenAPI 3.0 specification.
  termsOfService: https://twitter.com/en/tos
  contact:
    name: API Support
    url: https://www.begambleaware.org/
    email: sink@etlgr.com
  license:
    name: GPL 3.0
    url: https://www.gnu.org/licenses/gpl-3.0.en.html
  version: 1.0.0
servers:
  - url: http://localhost:{port}/api/v1/metadata
    description: Local development container
    variables:
      port:
        enum:
          - '8080'
        default: '8080'
  - url: https://raspberrypi.tigon-court.ts.net/api/v1/metadata
    description: Production server
tags:
  - name: metadata
    description: Manage files and directories metadata
    externalDocs:
      description: Find out more
      url: https://en.wikipedia.org/wiki/Metadata
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
paths:
  /nodes:
    post:
      description: Create new metadata record
      summary: Create new metadata record
      tags:
        - metadata
      operationId: createMetadata
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata'
        '405':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      requestBody:
        $ref: '#/components/requestBodies/CreateMetadataRequest'
components:
  schemas:
    Kind:
      type: string
      enum:
        - file
        - directory
    ErrorModel:
      description: Generic error
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
    Metadata:
      description: Metadata record
      type: object
      required:
        - id
        - kind
        - name
        - created
        - last_modified
        - raw_access
        - status
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        kind:
          $ref: '#/components/schemas/Kind'
        blob_type:
          type: string
          nullable: true
        blob_ref:
          type: string
          nullable: true
        name:
          type: string
        created:
          type: string
          format: date-time
        last_modified:
          type: string
          format: date-time
        size_bytes:
          type: integer
          format: int64
          nullable: true
        media_type:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        hashes:
          type: array
          nullable: true
          items:
            type: object
            properties:
              algorithm:
                type: string
              encoding:
                type: string
              value:
                type: string
        thumbnails:
          type: array
          nullable: true
          items:
            type: object
            required:
              - width
              - height
            properties:
              width:
                type: integer
                minimum: 0
                exclusiveMinimum: true
              height:
                type: integer
                minimum: 0
                exclusiveMinimum: true
        consolidation_info:
          type: object
          nullable: true
          required:
            - version
            - consolidated_at
          properties:
            version:
              type: string
            consolidated_at:
              type: string
              format: date-time
        raw_access:
          type: boolean
          default: false
        status:
          type: string
          enum:
            - unavailable
            - deleted
            - staged
            - active
  requestBodies:
    CreateMetadataRequest:
      description: Data object to save a new metadata entry
      required: true
      content:
        application/json:
          schema:
            description: Metadata record
            type: object
            required:
              - kind
              - name
              - created
              - last_modified
            properties:
              parent_id:
                type: string
                format: uuid
                nullable: true
              kind:
                $ref: '#/components/schemas/Kind'
              name:
                type: string
              created:
                type: string
                format: date-time
              last_modified:
                type: string
                format: date-time
              suggested_media_type:
                description: Suggested media type. Might be refined automatically.
                type: string
                nullable: true
              metadata:
                type: object
                additionalProperties: true
                nullable: true
              raw_access:
                type: boolean
                default: false
